<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>치즈볼의 덕질 공부 노트</title>
<style>

:root{
  --pri:#b9a6f5;--soft:#f3efff;--deep:#6a4fd0;
  --ink:#3a3550;--sub:#8b87a3;--line:#ece9f6;--bg:#fff;
  --ok:#5fc59a;--warn:#f3a26b;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#fff}
body{margin:0;background:#fff;color:var(--ink);font-family:"Memoment","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400;font-synthesis:none;line-height:1.45}
h1,h2,h3,b,strong{font-weight:400}
.wrap{max-width:1100px;margin:0 auto;padding:14px 18px 40px}

/* header */
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:6px 2px 12px;border-bottom:2px dashed var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-size:26px;color:var(--ink);white-space:nowrap}
.logo svg{width:30px;height:30px}
nav{display:flex;gap:6px;margin-left:8px}
nav button{font:inherit;font-size:17px;color:var(--sub);background:none;border:0;padding:8px 14px;border-radius:14px;cursor:pointer}
nav button.on{background:var(--soft);color:var(--deep);box-shadow:inset 0 -3px 0 var(--pri)}
.clock{margin-left:auto;text-align:right;color:var(--sub);font-size:14px;line-height:1.25}
.clock b{display:block;font-size:24px;color:var(--deep);font-variant-numeric:tabular-nums;letter-spacing:.5px}

/* hero */
.hero{position:relative;margin-top:16px;border-radius:var(--r);background:var(--soft);border:2px solid var(--pri);padding:22px 24px;display:flex;align-items:center;gap:16px;overflow:hidden;min-height:170px}
.hero .txt{flex:1;z-index:1}
.hero .d{font-size:16px;color:var(--sub)}
.hero h2{margin:4px 0 6px;font-size:38px;line-height:1.2}
.hero h2 em{font-style:normal;color:var(--deep);background:linear-gradient(transparent 62%,#fff 62%)}
.hero .s{font-size:17px;color:var(--sub)}
.hero .pic{flex:none;width:230px;height:140px;display:flex;align-items:center;justify-content:center}
.pic img{max-width:100%;max-height:100%;object-fit:contain;border-radius:16px}
.spark{position:absolute;color:var(--pri);opacity:.7;font-size:22px;pointer-events:none}

/* week strip */
.week{display:flex;gap:8px;margin:14px 0}
.week div{flex:1;text-align:center;padding:9px 0;border-radius:16px;background:var(--soft);color:var(--sub);font-size:15px;border:2px solid transparent}
.week div small{display:block;font-size:12px}
.week .today{background:var(--pri);color:#fff;border-color:var(--pri)}
.week .done::after{content:"⭐";display:block;font-size:12px;line-height:1}

/* layout */
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.card{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;box-shadow:0 4px 14px rgba(120,100,180,.07)}
.card h3{margin:0 0 12px;font-size:23px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font-size:13px;background:var(--soft);color:var(--deep);border-radius:12px;padding:2px 10px}
.grid>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}

/* tasks */
.task{display:flex;align-items:center;gap:12px;padding:12px 12px;border:2px solid var(--line);border-radius:16px;margin-bottom:10px;background:#fff;cursor:pointer;transition:.15s}
.task:hover{border-color:var(--pri)}
.task input{appearance:none;-webkit-appearance:none;width:28px;height:28px;border:3px solid var(--pri);border-radius:9px;flex:none;margin:0;display:grid;place-content:center;background:#fff;cursor:pointer}
.task input:checked{background:var(--pri)}
.task input:checked::after{content:"✓";color:#fff;font-size:19px;line-height:1}
.task .subj{flex:none;min-width:76px;color:var(--deep);font-size:16px}
.task .what{flex:1;font-size:17px}
.task .what small{display:block;color:var(--sub);font-size:13px}
.task.done{background:var(--soft);border-color:transparent}
.task.done .what{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--pri);text-decoration-thickness:2px}
.task a{flex:none;font-size:14px;color:var(--deep);border:2px solid var(--pri);border-radius:12px;padding:5px 11px;text-decoration:none;background:#fff}
.task a.off{opacity:.45;pointer-events:none}
.empty{color:var(--sub);text-align:center;padding:16px 0;font-size:16px}
.praise{display:none;align-items:center;gap:14px;background:var(--soft);border-radius:18px;padding:10px 14px;margin:2px 0 12px}
.praise.on{display:flex}
.praise img{height:70px}
.praise span{font-size:20px;color:var(--deep)}
.sub-title{margin:20px 0 10px;font-size:20px}
.feel{display:flex;gap:10px;flex-wrap:wrap}
.feel button,.photo{font:inherit;font-size:16px;color:var(--ink);padding:10px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;cursor:pointer;transition:.15s}
.feel button:hover,.photo:hover{border-color:var(--pri)}
.feel button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.photo{border-color:var(--pri);color:var(--deep);border-style:dashed}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:12px;border:2px solid var(--line)}

/* concept */
.concept{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;background:var(--soft);border-radius:16px;margin-bottom:9px;font-size:17px}
.concept i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;font-style:normal;display:grid;place-content:center;font-size:16px}
.next-row{font-size:18px;line-height:1.6}
.next-row small{color:var(--deep);font-size:15px;display:block}
.mini{display:flex;gap:10px;justify-content:space-around;text-align:center}
.mini div{flex:1;background:var(--soft);border-radius:16px;padding:10px 4px;font-size:14px;color:var(--sub)}
.mini b{display:block;font-size:26px;color:var(--deep)}

/* goal */
.goal{margin-top:16px;display:flex;align-items:center;gap:16px;border-radius:var(--r);border:2px solid var(--pri);background:var(--soft);padding:14px 20px;overflow:hidden}
.goal svg{flex:none;width:52px;height:52px}
.goal .t{font-size:26px}
.goal .s{color:var(--sub);font-size:14px}
.goal .dd{margin-left:auto;text-align:right;font-size:38px;color:var(--deep);line-height:1}
.goal .dd small{display:block;font-size:13px;color:var(--sub);margin-top:4px}
.goal .pic{flex:none;width:150px;height:70px;display:flex;align-items:center}

/* tables / log */
.hide{display:none}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:10px 8px;border-bottom:2px dashed var(--line);text-align:left;vertical-align:top}
th{color:var(--sub);font-size:14px}
tr.cur td{background:var(--soft)}
.entry{border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.entry .h{display:flex;gap:10px;align-items:center;font-size:19px;margin-bottom:6px}
.entry p{margin:4px 0;font-size:16px}
.entry .tr{color:var(--sub);font-size:15px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:14px;font-size:15px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}


/* ===== 꾸미기 ===== */
img.slot{cursor:pointer;user-select:none;-webkit-user-drag:none}
.logoimg{width:44px;height:44px;object-fit:contain;border-radius:50%;background:var(--soft);padding:3px;animation:wig 3.2s ease-in-out infinite}
.hero{background-image:radial-gradient(var(--pri) 1.6px,transparent 1.8px),radial-gradient(var(--pri) 1.2px,transparent 1.4px);background-size:34px 34px,34px 34px;background-position:0 0,17px 17px;background-color:var(--soft)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--soft) 25%,rgba(255,255,255,0) 70%);pointer-events:none}
.hero .pic{position:relative;width:260px;height:170px;z-index:1}
.hero .pic img{border-radius:20px;animation:float 4s ease-in-out infinite}
.bubble{position:absolute;left:-10px;top:-8px;z-index:2;background:#fff;border:2.5px solid var(--pri);color:var(--deep);font-size:16px;padding:6px 14px;border-radius:18px;box-shadow:0 3px 8px rgba(0,0,0,.06);animation:pop 3s ease-in-out infinite;max-width:210px;line-height:1.25}
.bubble::after{content:"";position:absolute;left:30px;bottom:-11px;width:16px;height:16px;background:#fff;border-right:2.5px solid var(--pri);border-bottom:2.5px solid var(--pri);transform:rotate(45deg)}
.bubble.sm{position:relative;left:auto;top:auto;font-size:14px;padding:4px 11px;display:inline-block;margin-right:6px;animation:pop 2.6s ease-in-out infinite}
.bubble.sm::after{left:auto;right:14px;bottom:-9px;width:12px;height:12px}
.cheer{margin-left:auto;display:flex;align-items:flex-end;gap:2px}
.cheer img{height:62px;width:auto;max-width:88px;object-fit:contain;animation:wig 2.4s ease-in-out infinite;transform-origin:50% 90%}
.card{position:relative}
.card::before{content:"";position:absolute;top:-10px;left:26px;width:74px;height:20px;background:var(--pri);opacity:.6;border-radius:3px;transform:rotate(-3deg)}
.card:nth-child(even)::before{left:auto;right:26px;transform:rotate(3deg)}
.praise img{animation:wig 1s ease-in-out infinite}
.goal{padding:18px 22px;background-image:radial-gradient(var(--pri) 1.4px,transparent 1.6px);background-size:30px 30px;background-color:var(--soft);position:relative}
.goal .pic{width:auto;height:74px;gap:6px}
.goal .pic img{height:74px;width:auto;max-width:130px;object-fit:contain;animation:float 3.6s ease-in-out infinite}
.goal .pic img+img{animation-delay:-1.8s}
.dd{background:#fff;border:3px solid var(--pri);border-radius:22px;padding:8px 18px;box-shadow:0 4px 10px rgba(0,0,0,.06);animation:pop 3s ease-in-out infinite}
.goal .dd{margin-left:0}
.goal .t{font-size:28px}
.ribbon{display:inline-block;background:var(--pri);color:#fff;border-radius:12px;padding:1px 10px;font-size:13px;margin-bottom:4px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wig{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:820px){
  .goal{display:grid;grid-template-columns:auto 1fr;gap:10px 14px}
  .goal .pic{display:flex!important;grid-column:1/-1;justify-content:center}
  .goal .dd{grid-column:1/-1;justify-self:center;font-size:34px}
  .hero .pic{width:100%;justify-content:flex-end}
  .bubble{left:6px}
}
@media(max-width:820px){
  .grid{grid-template-columns:1fr}
  .hero{flex-direction:column;align-items:flex-start}
  .hero h2{font-size:30px}
  .hero .pic{width:100%;height:120px}
  .clock{margin-left:0;text-align:left;width:100%}
  nav{margin-left:0;width:100%}
  nav button{flex:1;padding:8px 4px;font-size:16px}
  .task{flex-wrap:wrap}
  .goal{flex-wrap:wrap}
  .goal .pic{display:none}
}

/* ===== 가독성·패턴 강화 (검은 글씨, 큰 제목, 그라데이션) ===== */
:root{--pri2:#8fb4f7;--tint:#e4dcff;--ink:#111;--sub:#3d3a4f;--line:#e2deee}
body{color:#111}
.logo{font-size:34px;color:#111}
.logoimg{width:54px;height:54px;background:linear-gradient(135deg,var(--tint),var(--soft));border:2px solid var(--pri)}
nav button{font-size:19px;color:#333}
nav button.on{color:#111;background:linear-gradient(135deg,var(--tint),var(--soft));box-shadow:inset 0 -4px 0 var(--pri)}
.clock{color:#333;font-size:15px}
.clock b{color:#111;font-size:28px}
header{border-bottom:0;position:relative;padding-bottom:18px}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:radial-gradient(circle at 10px 0,transparent 8px,var(--pri) 8.5px,var(--pri) 10px,transparent 10.5px) 0 0/20px 10px repeat-x;opacity:.9}

.hero{border:0;padding:26px 28px;min-height:200px;
  background:
    radial-gradient(circle at 92% 12%,rgba(255,255,255,.75) 0 60px,transparent 61px),
    radial-gradient(var(--pri) 2px,transparent 2.4px) 0 0/30px 30px,
    repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 14px,transparent 14px 28px),
    linear-gradient(120deg,var(--tint),var(--soft) 55%,#fff);
  box-shadow:0 0 0 3px var(--pri),0 8px 20px rgba(0,0,0,.08)}
.hero::before{background:none}
.hero .d{font-size:19px;color:#222}
.hero h2{font-size:54px;line-height:1.15;color:#111;margin:6px 0 8px;letter-spacing:-1px}
.hero h2 em{color:#111;background:linear-gradient(transparent 52%,var(--pri) 52%,var(--pri2) 92%,transparent 92%);padding:0 4px;border-radius:4px}
.hero .s{font-size:19px;color:#222}
.bubble{color:#111;font-size:18px;border-color:var(--deep)}
.bubble::after{border-color:var(--deep)}

.week div{background:linear-gradient(180deg,var(--soft),var(--tint));color:#111;font-size:18px;border:2px solid var(--pri);padding:10px 0}
.week div small{font-size:14px;color:#333}
.week .today{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#111;box-shadow:0 4px 0 var(--deep);transform:translateY(-2px)}
.week .today small{color:#111}

.card{border:2.5px solid var(--pri);padding:24px 20px 18px;
  background:linear-gradient(90deg,var(--pri),var(--pri2)) 0 0/100% 9px no-repeat,
    radial-gradient(var(--tint) 1.4px,transparent 1.8px) 0 0/22px 22px,#fff}
.card h3{font-size:30px;color:#111;margin-bottom:14px}
.chip{background:linear-gradient(135deg,var(--tint),var(--soft));color:#111;border:1.5px solid var(--pri);font-size:14px;padding:2px 11px}
.sub-title{font-size:25px;color:#111}

.task{border:2.5px solid var(--pri);border-left-width:10px;border-radius:16px;font-size:19px;background:#fff;box-shadow:0 3px 0 var(--tint)}
.task input{border-color:var(--deep);width:30px;height:30px}
.task input:checked{background:linear-gradient(135deg,var(--pri),var(--pri2))}
.task input:checked::after{color:#111;font-size:22px}
.task .subj{color:#111;background:var(--tint);border-radius:10px;padding:3px 9px;min-width:0;font-size:16px;text-align:center}
.task .what{font-size:20px;color:#111}
.task .what small{color:#444;font-size:14px}
.task.done{background:repeating-linear-gradient(135deg,var(--soft) 0 10px,#fff 10px 20px);border-color:var(--pri)}
.task.done .what{color:#444}
.task a{color:#111;border-color:var(--deep);background:linear-gradient(135deg,var(--tint),var(--soft));font-size:15px}

.feel button,.photo{color:#111;border:2.5px solid var(--pri);font-size:18px}
.feel button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#111;border-color:var(--deep)}
.photo{background:var(--soft);border-color:var(--deep);color:#111}

.concept{background:linear-gradient(90deg,var(--tint),var(--soft));border-left:8px solid var(--pri);color:#111;font-size:19px;border-radius:14px}
.concept:nth-child(2){background:linear-gradient(90deg,var(--soft),var(--tint));border-left-color:var(--pri2)}
.concept i{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#111;width:32px;height:32px;font-size:18px}
.next-row{font-size:20px;color:#111}
.next-row small{color:#111;background:var(--tint);display:inline-block;padding:1px 10px;border-radius:10px;margin-bottom:4px}
.mini div{background:linear-gradient(180deg,var(--soft),var(--tint));color:#222;font-size:15px;border:2px solid var(--pri)}
.mini b{color:#111;font-size:32px}
.empty{color:#333}
.praise{background:repeating-linear-gradient(135deg,var(--tint) 0 12px,var(--soft) 12px 24px);border:2.5px solid var(--pri)}
.praise span{color:#111;font-size:22px}

.goal{border:0;padding:22px 26px;
  background:
    radial-gradient(circle at 8% 120%,rgba(255,255,255,.7) 0 70px,transparent 71px),
    repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 12px,transparent 12px 24px),
    radial-gradient(var(--pri) 1.6px,transparent 2px) 0 0/28px 28px,
    linear-gradient(120deg,var(--tint),var(--soft) 60%,var(--tint));
  box-shadow:0 0 0 3px var(--pri),0 8px 20px rgba(0,0,0,.08)}
.goal svg{width:60px;height:60px}
.goal svg{stroke:var(--deep)}
.goal .t{font-size:34px;color:#111}
.goal .s{color:#222;font-size:16px}
.ribbon{background:linear-gradient(90deg,var(--pri),var(--pri2));color:#111;font-size:14px;padding:2px 12px}
.dd{color:#111;font-size:48px;background:linear-gradient(135deg,#fff,var(--soft));border:3.5px solid var(--deep)}
.dd small{color:#222!important;font-size:14px!important}

th{color:#222;font-size:15px}
td,th{border-bottom:2px dashed var(--pri)}
tr.cur td{background:var(--tint)}
.entry{border:2.5px solid var(--pri);background:linear-gradient(180deg,#fff,var(--soft))}
.entry .h{font-size:22px}
.entry p{font-size:17px;color:#111}
.entry .tr{color:#333}
.toast{background:#111}
@media(max-width:820px){
  .logo{font-size:26px}.logoimg{width:44px;height:44px}
  .hero h2{font-size:38px}
  .card h3{font-size:25px}
  .goal .t{font-size:27px}.dd{font-size:40px}
  .task .what{font-size:18px}
}
.card h3 .cheer{flex:none}.card h3 .cheer img{height:54px}

/* ===== 이미지 크게 ===== */
.card h3 .cheer img{height:120px;max-width:190px}
.card h3{min-height:74px;align-items:center}
.card h3 .cheer{margin-top:-22px;margin-bottom:-14px}
.card h3 .bubble.sm{font-size:16px;margin-bottom:34px}
.praise img{height:96px}
.goal .pic{height:130px;gap:8px}
.goal .pic img{height:130px;max-width:230px}
.goal{padding-top:20px;padding-bottom:20px}
.hero .pic{width:330px;height:200px}
@media(max-width:820px){
  .card h3 .cheer img{height:96px;max-width:150px}
  .goal .pic{height:110px}.goal .pic img{height:110px;max-width:170px}
  .hero .pic{width:100%;height:170px}
}

.card h3 .cheer{margin-bottom:0}
.dd{white-space:nowrap}
.goal{flex-wrap:wrap;row-gap:8px}
.goal .pic img{max-width:150px;height:120px}
.goal .pic{height:120px}
@media(max-width:820px){.goal .pic img{height:100px;max-width:140px}.goal .pic{height:100px}}
.goal .pic img{max-width:200px}
@media(max-width:820px){.goal .pic img{max-width:150px}}

/* ===== GIF처럼 움직이는 캐릭터 ===== */
@keyframes jump{0%,60%,100%{transform:translateY(0) scale(1,1)}8%{transform:translateY(0) scale(1.1,.88)}22%{transform:translateY(-22px) scale(.94,1.08)}36%{transform:translateY(0) scale(1.1,.9)}46%{transform:translateY(-9px) scale(.98,1.03)}54%{transform:translateY(0) scale(1.04,.96)}}
@keyframes crawl{0%,100%{transform:translateX(-6px) rotate(-2deg) scale(1,1)}25%{transform:translateX(0) rotate(0) scale(1.03,.97)}50%{transform:translateX(6px) rotate(2deg) scale(1,1)}75%{transform:translateX(0) rotate(0) scale(1.03,.97)}}
@keyframes swayy{0%,100%{transform:rotate(-3deg) translateY(0)}25%{transform:rotate(0) translateY(-7px)}50%{transform:rotate(3deg) translateY(0)}75%{transform:rotate(0) translateY(-7px)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(25deg)}}
html img.slot{transform-origin:50% 100%}
html img.slot[data-kind="jump"]{animation:jump 1.7s ease-in-out infinite}
html img.slot[data-kind="crawl"]{animation:crawl 2.6s ease-in-out infinite}
html img.slot[data-kind="sway"]{animation:swayy 3s ease-in-out infinite}
html img.slot[data-kind="float"]{animation:float 3s ease-in-out infinite}
.spark{animation:twinkle 2.2s ease-in-out infinite}
.spark+.spark{animation-delay:-1.1s}

/* ===== 순공시간 · 퀴즈 ===== */
.timebig{font-size:48px;color:#111;text-align:center;padding:6px 0 10px;background:linear-gradient(135deg,var(--tint),var(--soft));border-radius:18px;margin-bottom:12px}
.timerow{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.timerow input{width:74px;font:inherit;font-size:24px;text-align:center;padding:8px 6px;border:2.5px solid var(--pri);border-radius:14px;background:#fff;color:#111}
.timerow span{font-size:18px;color:#111}
.timerow button,.quick button,.qgo{font:inherit;font-size:18px;color:#111;background:linear-gradient(135deg,var(--pri),var(--pri2));border:2.5px solid var(--deep);border-radius:14px;padding:9px 18px;cursor:pointer}
.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.quick button{font-size:16px;padding:7px 14px;background:#fff;border-color:var(--pri)}
.quick button.ghost,.qgo.ghost{background:var(--soft);border-color:var(--line)}
.mini.mt{margin-top:12px}
.qbtn{flex:none;font:inherit;font-size:15px;color:#111;background:linear-gradient(135deg,var(--pri),var(--pri2));border:2px solid var(--deep);border-radius:12px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(30,20,60,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.mbox{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:#fff;border:3px solid var(--pri);border-radius:26px;padding:18px 18px 20px;box-shadow:0 14px 40px rgba(0,0,0,.25)}
.qhead{display:flex;align-items:center;gap:10px;font-size:19px;color:#111;margin-bottom:12px}
.qhead span{flex:1}.qhead b{background:var(--tint);border-radius:12px;padding:2px 12px}
.qx{font:inherit;border:0;background:var(--soft);border-radius:50%;width:36px;height:36px;font-size:17px;cursor:pointer;color:#111}
.qprompt{font-size:32px;color:#111;text-align:center;background:linear-gradient(135deg,var(--tint),var(--soft));border-radius:20px;padding:18px 10px;margin-bottom:14px;line-height:1.3;word-break:keep-all}
.qprompt small{display:block;font-size:16px;color:#333;margin-top:6px}
.qchoices{display:grid;gap:10px}
.qc{font:inherit;font-size:21px;color:#111;text-align:left;background:#fff;border:2.5px solid var(--pri);border-radius:16px;padding:12px 14px;cursor:pointer}
.qc:hover:not(:disabled){background:var(--soft)}
.qc.right{background:#d9f5e6;border-color:#2fa86b}
.qc.wrong{background:#ffe0e0;border-color:#e0524e}
.qspell{display:flex;gap:8px}
.qspell input{flex:1;min-width:0;font:inherit;font-size:24px;padding:10px 12px;border:2.5px solid var(--pri);border-radius:14px;color:#111}
.qfb{margin-top:12px}
.okmsg,.nomsg{font-size:22px;color:#111;padding:8px 12px;border-radius:14px}
.okmsg{background:#d9f5e6}.nomsg{background:#ffe9e0}
.qexp{margin:8px 2px;font-size:16px;color:#333}
.qfb .qgo{width:100%;margin-top:8px}
.qscore{font-size:60px;text-align:center;color:#111;padding:6px 0}
.qscore small{display:block;font-size:19px;color:#333}
.qwrong{background:var(--soft);border-radius:16px;padding:10px 14px;margin:10px 0;font-size:17px;color:#111;line-height:1.7}
.qbtns{display:flex;gap:10px}.qbtns .qgo{flex:1}
@media(max-width:480px){.timebig{font-size:40px}.qprompt{font-size:26px}.qc{font-size:19px}}
</style>
</head>
<body>
<noscript><p style="padding:20px;font-size:18px">이 화면에서는 작동하지 않아요. Safari(또는 크롬) 브라우저로 열어 주세요.</p></noscript>
<div class="wrap">
  <header>
    <div class="logo">
      <img data-kind="sway" class="logoimg slot" data-slot="0" alt="">
      치즈볼의 덕질 공부 노트
    </div>
    <nav>
      <button class="on" data-tab="today">오늘의 공부</button>
      <button data-tab="plan">주간 계획</button>
      <button data-tab="log">공부 기록</button>
    </nav>
    <div class="clock"><span id="date"></span><b id="time"></b>대한민국 표준시(KST)</div>
  </header>

  <!-- 오늘의 공부 -->
  <section id="today">
    <div class="hero">
      <span class="spark" style="left:48%;top:12px">✦</span><span class="spark" style="right:270px;bottom:14px;font-size:16px">✧</span>
      <div class="txt">
        <div class="d" id="heroDate"></div>
        <h2 id="heroTitle"></h2>
        <div class="s">시간보다 분량으로, 하나씩 차근차근.</div>
      </div>
      <div class="pic"><div class="bubble" id="bubble"></div><img data-kind="jump" class="slot" data-slot="1" alt=""></div>
    </div>

    <div class="week" id="week"></div>

    <div class="grid">
      <div class="card">
        <h3>📚 오늘 할 공부 <span class="chip" id="planChip"></span><span class="cheer"><span class="bubble sm" id="bubble2">화이팅!</span><img data-kind="crawl" class="slot" data-slot="2" alt=""></span></h3>
        <div class="praise" id="praise"><img data-kind="sway" class="slot" data-slot="3" alt=""><span>오늘 할 일 다 했어요! 최고 🎉</span></div>
        <div id="tasks"></div>
        <h3 class="sub-title">공부는 어땠나요?</h3>
        <div class="feel" id="feel">
          <button data-v="easy">🙂 쉬웠어요</button>
          <button data-v="ok">😐 괜찮았어요</button>
          <button data-v="hard">😟 어려웠어요</button>
          <label class="photo">🖼 모르는 문제 사진 올리기<input id="file" type="file" accept="image/*" multiple hidden></label>
        </div>
        <div class="thumbs" id="thumbs"></div>
      </div>
      <div class="stack">
        <div class="card">
          <h3>📝 오늘의 개념 세 문장 <span class="chip" id="conceptChip"></span><span class="cheer"><img data-kind="jump" class="slot" data-slot="4" alt=""></span></h3>
          <div id="concepts"></div>
        </div>
        <div class="card">
          <h3>👉 다음 공부 <span class="cheer"><img data-kind="crawl" class="slot" data-slot="5" alt=""></span></h3>
          <div class="next-row" id="next"></div>
        </div>
        <div class="card">
          <h3>⏱ 순공시간 <span class="chip">타이머로 잰 시간을 적어요</span></h3>
          <div class="timebig" id="minToday">0분</div>
          <div class="timerow"><input id="minH" type="number" inputmode="numeric" min="0" max="12" placeholder="0"><span>시간</span><input id="minM" type="number" inputmode="numeric" min="0" max="59" placeholder="0"><span>분</span><button type="button" id="minAdd">추가</button></div>
          <div class="quick"><button type="button" data-m="10">+10분</button><button type="button" data-m="30">+30분</button><button type="button" data-m="60">+1시간</button><button type="button" id="minUndo" class="ghost">↩ 마지막 취소</button></div>
          <div class="mini mt"><div><b id="minWeek">0분</b>이번 주</div><div><b id="minMonth">0분</b>이번 달</div></div>
        </div>
        <div class="card">
          <h3>🌟 나의 기록</h3>
          <div class="mini">
            <div><b id="stStreak">0</b>연속 공부일</div>
            <div><b id="stDone">0</b>완료한 공부</div>
            <div><b id="stWeek">0/7</b>이번 주 ⭐</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 주간 계획 -->
  <section id="plan" class="hide">
    <div class="card" style="margin-top:16px">
      <h3>이번 주 계획 <span class="chip">월~일</span></h3>
      <div id="planTable"></div>
    </div>
  </section>

  <!-- 공부 기록 -->
  <section id="log" class="hide">
    <div class="card" style="margin-top:16px">
      <h3>공부 기록 <span class="chip">차곡차곡 쌓여요</span></h3>
      <div id="logList"></div>
    </div>
  </section>

  <div class="goal">
    <svg viewBox="0 0 52 52" fill="none" stroke="var(--deep)" stroke-width="3.2" stroke-linecap="round"><circle cx="26" cy="26" r="21"/><circle cx="26" cy="26" r="13"/><circle cx="26" cy="26" r="4.5" fill="var(--pri)"/><path d="M26 26 46 6M46 6v9M46 6h-9"/></svg>
    <div>
      <span class="ribbon">나의 목표</span><div class="t" id="goalTitle">중1 수학 1학기 완주</div>
      <div class="s" id="goalSub">2026.10.12 → 2027.1월 중후반 · 내 속도에 맞춰 분량을 조절해요.</div>
    </div>
    <div class="pic"><img data-kind="sway" class="slot" data-slot="6" alt=""><img data-kind="jump" class="slot" data-slot="7" alt=""></div>
    <div class="dd" id="dday"></div>
  </div>
</div>
<div class="modal" id="quizModal" hidden><div class="mbox" id="quizBox"></div></div>
<div class="toast" id="toast"></div>

function tasksOf(date){return DB.plan.filter(function(r){return r.date===date})}
function weekStart(d){return addDays(d,-wIdx(d))}
function repeatItems(date){
  var out=[], wi=wIdx(date), mon=weekStart(date), sun=addDays(mon,6);
  DB.repeats.forEach(function(r){
    var times=+r.times||1;
    var doneOn=DB.rchecks.some(function(c){return c.name===r.name&&c.date===date});
    if(r.day==="자유"){
      if(wi===6)return;                                  // 일요일은 쉬어요
      var cnt=DB.rchecks.filter(function(c){return c.name===r.name&&c.date>=mon&&c.date<=sun}).length;
      if(cnt>=times&&!doneOn)return;                     // 이번 주 목표를 채우면 사라져요
      out.push({id:"rep:"+r.name,rep:true,flex:true,subject:r.subject||"반복",task:r.name,range:"이번 주 "+cnt+"/"+times,unit:r.memo||"",done:doneOn});
    }else if(r.day===DAYN[wi]){
      out.push({id:"rep:"+r.name,rep:true,subject:r.subject||"반복",task:r.name,range:"",unit:r.memo||"",done:doneOn});
    }
  });
  return out;
}
function dayItems(date){
  var t=tasksOf(date).slice();
  repeatItems(date).forEach(function(x){if(!x.flex||date===TODAY)t.push(x)});
  return t;
}
function allDone(date){var t=dayItems(date);return t.length>0&&t.every(function(x){return x.done})}
function findPlan(id){return DB.plan.filter(function(x){return String(x.id)===String(id)})[0]}
function setDone(r,on){

  if(!LIVE){var s=lget("local-done",{});s[r.id]=on;lset("local-done",s)}

function setRepeat(name,date,on){
  DB.rchecks=DB.rchecks.filter(function(c){return !(c.name===name&&c.date===date)});

var QZ=null;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function normEn(s){return String(s).toLowerCase().replace(/[.,!?]/g,"").replace(/^(to|a|an|the)\s+/,"").replace(/\s+/g," ").trim()}
function unitsOf(x){var m=String(x.unit||"").match(/유닛\s*(\d+)\s*[·,~\-]\s*(\d+)/);return m?[+m[1],+m[2]]:[]}
function usable(v){return v.en&&!/^\(/.test(v.en)}
function pickWords(pool,n){
  var wrong={},okToday={};
  DB.qlog.forEach(function(q){if(q.kind!=="word")return;if(!q.ok)wrong[q.key]=(wrong[q.key]||0)+1;else if(q.date===TODAY)okToday[q.key]=1});
  var items=pool.map(function(v){var w=1+(v.mark?2:0)+(wrong[v.en]||0)*2;if(okToday[v.en])w*=0.2;return {v:v,w:w}}),out=[];
  while(out.length<n&&items.length){
    var tot=items.reduce(function(a,x){return a+x.w},0),r=Math.random()*tot,i=0;
    for(;i<items.length;i++){r-=items[i].w;if(r<=0)break}
    if(i>=items.length)i=items.length-1;
    out.push(items.splice(i,1)[0].v);
  }
  return out;
}
function distractors(v,field,n){
  var all=DB.vocab.filter(function(x){return usable(x)&&x.en!==v.en&&x[field]&&x[field]!==v[field]});
  var same=shuffle(all.filter(function(x){return x.pos===v.pos})),rest=shuffle(all.filter(function(x){return x.pos!==v.pos}));
  var out=[],seen={};seen[v[field]]=1;
  same.concat(rest).forEach(function(x){if(out.length<n&&!seen[x[field]]){seen[x[field]]=1;out.push(x[field])}});
  return out;
}
function wordQuestion(v,type){
  var base={kind:"word",key:v.en,type:type,exp:v.en+" = "+v.ko+" ("+v.pos+")"};
  if(type==="spell"){base.prompt=v.ko;base.sub=v.pos+" "+(POS_LABEL[v.pos]||"")+" · 영어로 써요";base.answer=v.en;return base}
  if(type==="pos"){
    var ps=["n.","v.","adj.","adv.","prep.","phr.","phr. v."].filter(function(p){return p!==v.pos});
    var ch=shuffle([v.pos].concat(shuffle(ps).slice(0,3)));
    base.prompt=v.en;base.sub="품사는 무엇일까요?";base.choices=ch.map(function(p){return p+" "+(POS_LABEL[p]||"")});base.ans=ch.indexOf(v.pos);return base;
  }
  var d=distractors(v,"ko",3),cs=shuffle([v.ko].concat(d));
  base.prompt=v.en;base.sub=v.pos+" "+(POS_LABEL[v.pos]||"")+" · 뜻은 무엇일까요?";base.choices=cs;base.ans=cs.indexOf(v.ko);return base;
}
function buildWordSet(x){
  var us=unitsOf(x),pool=DB.vocab.filter(function(v){return usable(v)&&us.indexOf(v.u)>=0});
  var ws=pickWords(pool,wordN(x)),types=["mean","spell","pos"];
  return ws.map(function(v,i){var t=types[i%3];if(t==="spell"&&!v.spell)t="mean";return wordQuestion(v,t)});
}
function buildReviewSet(x){
  var qs=shuffle(reviewQs(x)).slice(0,3);
  return qs.map(function(q){return {kind:"review",key:q.key+"|"+q.q,type:"choice",prompt:q.q,sub:"",choices:q.opts,ans:(+q.ans)-1,exp:q.exp||""}});
}

  else h+='<div class="qchoices">'+q.choices.map(function(c,i){return '<button type="button" class="qc" data-i="'+i+'">'+esc(c)+'</button>'}).join("")+'</div>';

function answerQ(val){
  var q=QZ.qs[QZ.i];if(q.done)return;q.done=true;
  var ok=q.type==="spell"?normEn(val)===normEn(q.answer):(+val===q.ans);

  var rows=QZ.res.map(function(r){return {kind:r.q.kind,key:r.q.key,ok:r.ok}});

  if(QZ.kind==="word"&&QZ.x&&!QZ.x.rep){var pr=findPlan(QZ.x.id);if(pr&&!pr.done)setDone(pr,true)}
  var good=QZ.res.filter(function(r){return r.ok}).length,tot=QZ.res.length;
  var h='<div class="qhead"><span>'+esc(QZ.title)+' 결과</span><button type="button" class="qx" id="qClose" aria-label="닫기">✕</button></div>';
  h+='<div class="qscore">'+good+' / '+tot+'<small>'+(good===tot?"모두 맞혔어요! 최고 🌟":good>=tot/2?"잘했어요, 틀린 건 다음에 또 나와요":"괜찮아요, 틀린 문제는 다시 나와요")+'</small></div>';
  var wr=QZ.res.filter(function(r){return !r.ok});
  if(wr.length)h+='<div class="qwrong">'+wr.map(function(r){return '<div><b>'+esc(r.q.prompt)+'</b> → '+esc(r.q.type==="spell"?r.q.answer:r.q.choices[r.q.ans])+'</div>'}).join("")+'</div>';
  h+='<div class="qbtns"><button type="button" class="qgo" id="qMore">한 번 더</button><button type="button" class="qgo ghost" id="qClose2">닫기</button></div>';
  $("quizBox").innerHTML=h;
}
function moreQuiz(){
  var kind=QZ.kind,x=QZ.x,qs=kind==="word"?buildWordSet(x):buildReviewSet(x);
  if(!qs.length){closeQuiz();return}
  QZ={x:x,kind:kind,qs:qs,i:0,res:[],title:QZ.title};showQ();
}
$("quizModal").addEventListener("click",function(e){
  if(e.target===$("quizModal")||e.target.closest("#qClose")||e.target.closest("#qClose2")){closeQuiz();return}
  var c=e.target.closest(".qc");if(c&&QZ){answerQ(c.dataset.i);return}
  if(e.target.closest("#qOk")&&QZ){var v=$("qIn").value;if(v.trim())answerQ(v);return}
  if(e.target.closest("#qNext")){nextQ();return}
  if(e.target.closest("#qMore")){moreQuiz();return}
});
document.addEventListener("keydown",function(e){
  if($("quizModal").hidden)return;
  if(e.key==="Escape"){closeQuiz();return}
  if(e.key==="Enter"&&QZ){var nb=$("qNext");if(nb){nextQ();return}var inp=$("qIn");if(inp&&!inp.disabled&&inp.value.trim())answerQ(inp.value)}
});

/* ============ 이벤트 ============ */
$("tasks").addEventListener("click",function(e){
  var qb=e.target.closest(".qbtn");
  if(qb){e.preventDefault();e.stopPropagation();openQuiz(qb.closest(".task").dataset.id,qb.dataset.q);return}
  if(e.target.closest("a"))e.stopPropagation();
});
$("tasks").addEventListener("change",function(e){
  var it=e.target.closest(".task");if(!it)return;
  var id=it.dataset.id,on=e.target.checked,was=$("praise").classList.contains("on");
  if(id.indexOf("rep:")===0)setRepeat(id.slice(4),TODAY,on);
  else{var r=findPlan(id);if(r)setDone(r,on)}
  renderToday();
  if(allDone(TODAY)&&!was){toast("오늘 공부 완료! 🎉")}
});
$("feel").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  DB.mood=DB.mood||{};DB.mood[TODAY]=b.dataset.v;
  if(!LIVE){var m=lget("local-mood",{});m[TODAY]=b.dataset.v;lset("local-mood",m)}
  else send({action:"mood",date:TODAY,mood:b.dataset.v});
  renderToday();toast("기록했어요 ✏️");
});
$("file").addEventListener("change",function(e){
  [].forEach.call(e.target.files,function(f){
    var i=new Image();i.src=URL.createObjectURL(f);$("thumbs").appendChild(i);
    if(LIVE){var rd=new FileReader();rd.onload=function(){send({action:"photo",date:TODAY,name:f.name,mime:f.type,data:String(rd.result).split(",")[1]}).then(function(){toast("사진을 저장했어요 📷")})};rd.readAsDataURL(f)}
  });
  if(!LIVE)toast("예시 모드: 사진은 화면에만 보여요");
});
$("minAdd").addEventListener("click",function(){
  var h=+$("minH").value||0,m=+$("minM").value||0;addMinutes(h*60+m);$("minH").value="";$("minM").value="";
});
$("minUndo").addEventListener("click",undoMinutes);
[].forEach.call(document.querySelectorAll(".quick button[data-m]"),function(b){b.addEventListener("click",function(){addMinutes(+b.dataset.m)})});
[].forEach.call(document.querySelectorAll("nav button"),function(b){
  b.addEventListener("click",function(){
    [].forEach.call(document.querySelectorAll("nav button"),function(x){x.classList.toggle("on",x===b)});
    ["today","plan","log"].forEach(function(id){$(id).classList.toggle("hide",id!==b.dataset.tab)});
  });
});

/* ============ 폰트 (앱 스크립트: 드라이브 파일 → 적용) ============ */
if(HAS_GS){
  google.script.run.withSuccessHandler(function(b){
    if(!b)return;
    try{new FontFace("Memoment","url(data:font/woff2;base64,"+b+")").load().then(function(f){document.fonts.add(f)})}catch(e){}
  }).getFontBase64();
}

/* ============ 시작 ============ */
setInterval(tick,1000);
loadData().then(function(){renderAll();assignImages()}).catch(function(){toast("시트를 못 불러왔어요")});
</script>
</body>
</html>
